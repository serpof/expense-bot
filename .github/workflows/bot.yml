# Бот по расписанию: каждые 15 минут с 7 до 23 по Белграду зимой (летом — с 8 до полуночи).
# Ночью бот не работает: Telegram хранит сообщения 24 часа, утром первый запуск их заберёт.
name: bot

on:
  schedule:
    - cron: "*/15 6-21 * * *"  # время в UTC
  workflow_dispatch:  # кнопка Run workflow для ручного запуска

# Два запуска одновременно не нужны: второй подождёт первого.
concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    # Расписание включается переменной репозитория: gh variable set BOT_SCHEDULE --body on
    # Пока её нет, запуски пропускаются, и бот можно спокойно гонять на Mac.
    if: github.event_name == 'workflow_dispatch' || vars.BOT_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m expense_bot.run_once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
